# ======================================================================
# 探海灵眸 SeaSight — Nginx 站点配置（生产/试点环境）
#
# 部署位置：/etc/nginx/conf.d/seasight.conf
# 静态根：前端 vite build 产物（默认 /var/www/seasight/dist）
#
# 这个文件承担四件事，每件都有一个"不配就出问题"的坑：
#   1. SPA 路由回退       —— 不配则刷新子页面 404
#   2. API 反向代理       —— 保留真实客户端 IP（政务项目要审计）
#   3. WebSocket 升级     —— 不配 proxy_read_timeout 会陷入重连死循环
#   4. 视频流代理         —— go2rtc 的 FLV/WebRTC，需要关缓冲
#
# 用法：
#   sudo cp deploy/nginx/seasight.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# ======================================================================

upstream seasight_backend {
    server 127.0.0.1:8000;
    keepalive 32;                 # 复用后端连接，省掉每请求一次 TCP 握手
}

upstream seasight_go2rtc {
    server 127.0.0.1:1984;
    keepalive 16;
}

# 后端真实 IP 透传。若前面还有 SLB/WAF，按实际网段调整。
# ★ 不配这个，后端日志里所有请求的 remote_addr 都是 127.0.0.1，
#   出问题根本查不到是谁调的。
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    # 部署时改成实际路径
    root /var/www/seasight/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;     # 告警帧上传；默认 1m 会拒掉现场图片

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 压缩 ----------
    # ★ 一定要开：前端 echarts 单包 1MB，gzip 后 343KB，
    #   渔港 4G 链路上这是能不能秒开大屏的区别。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml
        application/wasm;

    # ---------- 1. SPA 路由回退 ----------
    # Vue Router 用 history 模式，/dashboard 这类路径在服务端没有对应文件。
    # 不写 try_files 的话，用户在大屏页按 F5 就是 404 ——
    # 演示时最容易翻车的一处。
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 绝不缓存，否则发版后用户拿到旧壳、
        # 去加载已被清掉的旧 hash 资源，白屏。
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------- 2. 带 hash 的构建产物：长期强缓存 ----------
    # vite 产物文件名带内容 hash，可以放心 immutable 缓存一年。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---------- 3. API 反向代理 ----------
    location /api/ {
        proxy_pass http://seasight_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";        # 配合 upstream keepalive

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 后端自身路由（/health、/docs、/openapi.json）
    # ★ 只放通 /health，/docs 在公网环境应当关掉 —— Swagger UI
    #   会把全部接口和参数结构暴露给任何人。
    location = /health {
        proxy_pass http://seasight_backend;
        proxy_set_header Host $host;
        access_log off;          # 探针每秒一次，别刷满日志
    }

    # ---------- 4. WebSocket 升级 ----------
    # 告警推送（/ws/alerts）走这里。
    location /ws/ {
        proxy_pass http://seasight_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";     # ★ 三行头缺一不可
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # ★★ 不能省这个 ★★
        # WebSocket 空闲超过 proxy_read_timeout 会被 Nginx 单方面切断，
        # 前端表现为"连上 → 断开 → 重连"无限循环，大屏上的实时告警
        # 一闪一闪。默认 60s，这里放到 1 小时。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;      # WS 不能缓冲
    }

    # ---------- 5. 视频流（go2rtc 代理） ----------
    # FLV 是长连接持续吐字节的。★ 开了 proxy_buffering 会攒够一块才发，
    # 播放器一直缓冲、延迟越积越大，看起来就是"视频一直转圈"。
    location /stream/ {
        proxy_pass http://seasight_go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_buffering off;          # ★ 必须关
        proxy_cache off;              # ★ 必须关
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;     # 长时间无帧也不要掐断
        proxy_send_timeout 3600s;
    }

    # ---------- 6. 挡住不该暴露的路径 ----------
    location ~ /\.(git|env|svn|DS_Store) {
        deny all;
        return 404;
    }
    # 源码/依赖目录绝不放在 web root，双保险再挡一层
    location ~ ^/(src|node_modules|deploy|backend|ml)/ {
        deny all;
        return 404;
    }
}

# ======================================================================
# HTTPS（可选，试点/上线必须开）
#
# 政务项目与个人隐私影像（渔民作业画面）走公网必须加密。
# 自购服务器可用 Let's Encrypt 免费证书：
#
#   sudo certbot --nginx -d your.domain.com
#
# 配好后建议同时开启 HSTS，并把 80 端口全量跳转到 443：
#
# server {
#     listen 443 ssl http2;
#     server_name your.domain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # ... 其余 location 复制自上面的 server 块 ...
# }
#
# server {
#     listen 80;
#     server_name your.domain.com;
#     return 301 https://$host$request_uri;
# }
