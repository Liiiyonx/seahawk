  root_cause_chain:
    - 9-29 起两个 MCP 资产端点指向临时 Cloudflare 快速隧道（R-NX-05 时代），旧隧道死亡
      → 平台侧 MCP 校验失败/调用无路由，为 R-NX-10 绑定缺口的源头之一；
    - 托管智能体（旧版 Managed Agents）编辑表单不暴露 MCP 绑定 → 改用新版单智能体
      （App agent）通过 studio API 完成 MCP 资产绑定；
    - App 智能体预览"系统异常，运行终止"且 ECS 零流量 → 定位为运行时内部异常：
      旧运行时为 IAM 认证且无法改（官方文档：认证类型创建后不可改）；
    - 解决：DELETE 旧运行时（core/runtimes API 204）→ 以 auth_type=API_KEY 重建
      agent-arts-rnx10-seasight-a1 → 平台自动创建绑定 API Key 身份 → UI「更新版本
      + 同步部署至实例」把智能体版本 v2 注入运行时 → 预览调试恢复、MCP 调用打通；
    - 教训：API 直接 POST /studio/agents/{id}/deploy 只建空运行时（v1 Initial version），
      必须经 UI 发布版本+同步部署才注入智能体；WS /ws 通道在该运行时类型上不可用
      （node-proxy 握手 500），预览调试/sessions-start HTTP 通道可用。

  honest_boundary: >-
    1) 本次验收为预览调试通道（studio 会话），非生产 API 通道；WS 数据面通道在该
    运行时类型上未通（平台侧 node-proxy 握手 500，已留证）。2) 运行回答中的事件
    数据（17 条事件、9 条泡沫类、坐标/置信度/设备号）全部来自 MCP 工具真实返回，
    与 ECS 服务端日志逐条对应；模型生成部分（处置建议）基于工具结果与提示词。
    3) MCP 端点仍为 Cloudflare 快速隧道（重启换 URL），持久化需改命名隧道或私网
    端点，已列入清理待办。4) 写入类工具未启用（SEASIGHT_MCP_ALLOW_WRITES 未开）。

