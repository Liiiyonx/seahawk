      本次问题经 read_skill_md 实际加载 4 个，cross-document-decision 未被触发。
    - 不是华为 AgentArts 托管平台验收（该验收仍为 R-NX-07 blocked / R-NX-08 未开始）。
    - 不是海域部署验证，不代表现场治理效果。
    - 感知精度仍为 not_evaluated；76% 只代表时序链路误报抑制率，不是识别准确率。
    - 演示知识资产不等于真实脱敏行业数据。
