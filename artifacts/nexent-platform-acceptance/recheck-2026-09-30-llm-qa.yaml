    final_answer_chars: 2777
    final_answer_headline: >-
      现行资产库中不存在针对“漏油／油污／溢油”的适用政策条款，疑似漏油事件不可
      套用海漂垃圾处置流程；应升级人工研判并转报环保／海事渠道，不得自动派单给
      打捞机器人或机械臂。
    final_answer_reported_gaps:
      - 事件库近 168 小时无油污记录，main_class=oil 过滤两次返回 [1000] 服务器内部错误
      - 全部事件 evidence_url=null，无影像可复核
      - 政策资产 source_uri=null，属演示资产，无外部法规原文可溯源
      - 无任何关联油污的工单或决策痕迹
  evidence_files:
