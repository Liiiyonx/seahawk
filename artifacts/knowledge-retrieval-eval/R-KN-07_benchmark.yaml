acceptance:
  record_id: R-KN-07
  date: "2026-10-25"
  status: completed
  title: 检索评测基准集与三系统对照评测（baseline 词法+图 / BGE-M3+Reranker 两阶段 / RRF 混合）

  benchmark:
    builder: scripts/build_retrieval_benchmark.py
    artifact: artifacts/knowledge-retrieval-eval/benchmark.json
    corpus: 本地后端 15 资产（8 份生态环境部公开文件 + 7 份演示资产），已发布本体 30 节点/60 关系
    items:
      single: 45（标题型问题，每资产 3 模板）
      single2: 60（实体型问题，本体已审核实体 2 模板——问题不含标题词，考内容级检索）
      multihop: 80（本体 2 跳关系链 A→B→C 构造，金标准=链上实体来源资产）
      refuse: 5（域外问题，无金标准资产）
    determinism: 模板固定、金标准全部取自本体/资产表本身，构建过程零模型调用

  systems:
    baseline: 生产检索器（POST /knowledge/search：词法打分 标题x6/正文x1.5/标准号x2 + 本体图扩展 hop_depth=1）
    twostage: BGE-M3 稠密召回（资产分块 800 字，cosine top-30）+ BGE-Reranker-V2-M3 精排（top-20 块）
    hybrid_rrf: baseline 与稠密资产排序的 RRF 融合（k=60）

  results_2026-10-25_v1:
    runner: scripts/run_retrieval_eval.py
    artifact: artifacts/knowledge-retrieval-eval/latest.json
    table: # hit@1 / hit@3 / hit@5 / MRR
      single_title_queries:  {baseline: [0.267, 0.533, 0.711, 0.442], twostage: [0.267, 0.489, 0.644, 0.423], hybrid: [0.267, 0.511, 0.711, 0.436]}
      single2_entity_queries: {baseline: [0.300, 0.500, 0.533, 0.416], twostage: [0.300, 0.550, 0.867, 0.498], hybrid: [0.300, 0.517, 0.633, 0.478]}
      multihop_2hop_queries:  {baseline: [0.650, 0.988, 1.000, 0.772], twostage: [0.650, 0.700, 0.700, 0.716], hybrid: [0.650, 0.963, 1.000, 0.764]}

  findings:
    - "内容型查询（single2）上两阶段检索大幅胜出：hit@5 86.7% vs 53.3%（+33.4pt）、MRR +0.082 —— 稠密向量补齐了词法在无标题词问题上的短板"
    - "多跳查询上现有本体图扩展是最强通道（hit@5 100%）：纯稠密检索丢失桥接文档（70%），RRF 混合恢复至 100% 且保住 single2 增益 —— 图扩展是本项目检索侧的护城河"
    - "hit@1 三系统同为 26.7%/30.0%：15 资产中 4 份同系列标准共享实体，top-1 区分度受语料规模限制（扩充语料后复评）"
    - "拒答可分性：本轮两套系统的 top-1 分数在 single 与 refuse 间均有重叠（baseline 37.5/49.5；两阶段 0.0035/0.0079），固定阈值 6.0 与校准阈值均不完全可分 —— 拒答判定不能只靠检索分，需结合证据覆盖判定（现有 QA 层设计一致），如实登记"

  honest_boundary: >-
    语料仅 15 资产（含 7 演示资产），区分度受限，v1 数字为小语料下相对结论；
    拒答池仅 5 题且其中 1 题与标准文本存在词法重叠；扩语料后将以 v2 复评并更新材料口径。
    两阶段/混合为评测 harness 实现（scripts/run_retrieval_eval.py），尚未合入生产检索接口。

  next:
    - 扩公开语料（生态环境部海洋类公告 8 → 30+ 份），v2 复评
    - v2 数字达标后将 RRF 混合合入生产检索（/knowledge/search 增加混合模式参数）
    - 材料 1/2 检索小节以 v2 数字定量化更新

  results_2026-10-26_v2:
    corpus: 27 资产（20 份公开文件[生态环境部两专栏采集：倾倒区公告/标准/入海排污口/综合治理方案等] + 7 演示资产）；本体 100 节点/200 关系
    benchmark: 301 题（81 标题型 / 100 实体型 / 120 多跳 / 5 拒答）
    table: # hit@1 / hit@3 / hit@5 / MRR
      single_title_queries:  {baseline: [0.123, 0.309, 0.432, 0.254], twostage: [0.074, 0.148, 0.222, 0.138], hybrid: [0.173, 0.309, 0.432, 0.284]}
      single2_entity_queries: {baseline: [0.140, 0.230, 0.420, 0.226], twostage: [0.140, 0.210, 0.250, 0.185], hybrid: [0.140, 0.170, 0.210, 0.196]}
      multihop_2hop_queries:  {baseline: [0.458, 0.458, 0.475, 0.469], twostage: [0.075, 0.458, 0.458, 0.267], hybrid: [0.075, 0.167, 0.458, 0.198]}
    findings_v2:
      - "语料 15→27 资产后任务显著变难（新增 13 份倾倒区/排污口类公告高度同构，top-1 区分度天然受限），全系统绝对值下降属预期"
      - "RRF 混合的相对增益在更难语料上保持：标题型 hit@1 12.3%→17.3%（+40% 相对）、MRR +0.030"
      - "纯稠密两阶段在同类公告近义场景退化（hit@1 7.4%）：整篇嵌入稀释标题信号——印证词法标题加权与图扩展的不可替代性，v3 方向=标题加权嵌入"
      - "多跳：baseline 图扩展 hit@5 47.5% 仍最强；dense 把桥接文档挤出前 3（hit@3 16.7% vs 45.8%），融合需按查询类型路由（标题/多跳走图、内容型走稠密）"
    honest_note: >-
      v1（15 资产）与 v2（27 资产）两轮均为完整可复现运行；两轮数字不可直接互比（语料与题集均变）。
      MaaS 共享端点限流导致 v2 运行耗时约 4 小时（429 退避），全部调用留缓存可复算。

  results_2026-10-26_v3_titleboost_and_routing:
    change: 稠密分块文本改为 标题x3+内容（强化标题信号）；新增 oracle 路由系统（多跳走词法图、其余走 hybrid_v3）
    table: # hit@1 / hit@3 / hit@5 / MRR（single=标题型）
      single:  {baseline: [0.123, 0.309, 0.432, 0.254], hybrid_v2: [0.173, 0.309, 0.432, 0.284], hybrid_v3: [0.148, 0.346, 0.444, 0.278]}
      routed_oracle: {single: 同 hybrid_v3, single2: 同 hybrid_v3, multihop: 回归 baseline [0.458, 0.458, 0.475, 0.469]}
    findings_v3:
      - 标题加权使混合检索 hit@3/hit@5 达全系统最高（0.346/0.444），hit@1 略低于 v2 混合（0.148 vs 0.173）——取长在召回深度
      - oracle 路由（多跳走图、单跳走混合）验证了按查询类型路由的上限：单跳全面优于 baseline 且多跳不损失
      - 生产 HybridIndex 已采用标题加权分块文本（2026-10-26）
    honest_note: 本轮 single2 各系统绝对值较上轮小幅波动（0.01~0.11，疑似嵌入缓存批间差异），两轮原始产物均留档可复算；结论以相对关系为准
