# Alembic logging configuration carrier -- SeaSight
#
# NOTE: This file intentionally contains ASCII ONLY.
#
# Reason: Alembic reads .ini files with a hardcoded encoding="locale"
# (see alembic/util/compat.py:130).  On Chinese Windows that resolves to
# cp936 (GBK), bypassing UTF-8 mode entirely, so ANY non-ASCII byte in
# this file makes every `alembic` subcommand die with:
#
#     UnicodeDecodeError: 'gbk' codec can't decode byte 0x80 ...
#
# The main Alembic configuration therefore lives in pyproject.toml, which
# Alembic reads in binary mode via tomllib and is immune to this bug.
# See the long comment at the top of pyproject.toml for the full story,
# including the three workarounds that were tested and do NOT work.
#
# Why logging stays here: TOML has no notion of the configparser
# [loggers]/[handlers]/[formatters] sections, and Alembic's official
# `alembic init --template pyproject` generates exactly this split --
# a pyproject.toml plus a logging-only alembic.ini.
#
# >>> Do NOT add non-ASCII characters below this line. <<<
# Put Chinese comments in pyproject.toml instead; that file is safe.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
